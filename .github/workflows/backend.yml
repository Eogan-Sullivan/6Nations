name: Backend
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run verify
      - run: npm run test:db
      - run: docker build -f backend/Dockerfile -t sixnations-backend:ci .
